<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Browser Tab Logo (Favicon) -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Food Caliper</title>

    <meta
      name="description"
      content="AI-powered volumetric analysis to estimate food volume and weight instantly from a single image."
    />
    <meta name="author" content="Bombe-19" />

    <!-- Open Graph (for sharing links) -->
    <meta property="og:title" content="Food Caliper" />
    <meta
      property="og:description"
      content="AI-powered volumetric analysis to estimate food volume and weight instantly from a single image."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <script>
      try {
        const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
